services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bizbize
      POSTGRES_USER: bizbize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated database password}
    volumes: ['db_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bizbize -d bizbize']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://bizbize:${POSTGRES_PASSWORD}@db:5432/bizbize
      APP_SECRET: ${APP_SECRET:?Set a generated application secret}
      PUBLIC_URL: https://${API_DOMAIN:?Set your actual API domain}
      WEB_ORIGINS: ${WEB_ORIGINS:?Set actual HTTPS web origins}
      SMTP_HOST: ${SMTP_HOST:?Set an SMTP service}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:?Set a verified sender}
      PHOTO_MODERATION: manual
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
  edge:
    image: caddy:2-alpine
    ports: ['80:80','443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro','caddy_data:/data','caddy_config:/config']
    depends_on: [api]
    restart: unless-stopped
volumes:
  db_data:
  caddy_data:
  caddy_config:
